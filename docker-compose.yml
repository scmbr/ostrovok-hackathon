services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: tima
      POSTGRES_PASSWORD: tima
      POSTGRES_DB: tima
    ports:
      - "127.0.0.1:5432:5432" # для cmd/collect с хоста
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tima -d tima"]
      interval: 3s
      timeout: 3s
      retries: 60

  app:
    build: .
    platform: linux/amd64
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://tima:tima@db:5432/tima?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
