services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: tima
      POSTGRES_PASSWORD: tima
      POSTGRES_DB: tima
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tima -d tima"]
      interval: 3s
      timeout: 3s
      retries: 60

  app:
    build: .
    platform: linux/amd64
    ports:
      - "8080:8080"
    # Значения читаются из .env (подстановка Compose); пустое или отсутствующее значение = умолчание.
    environment:
      DATABASE_URL: postgres://tima:tima@db:5432/tima?sslmode=disable
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 180s # миграции и заливка сида на медленной машине занимают больше минуты

volumes:
  dbdata:
