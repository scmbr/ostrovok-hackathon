# Разметка 18 демо-отелей для метрик качества (collect metrics, docs/metrics.md).
#
# Что размечено (уровень отеля, ответ «да / нет»):
#   sea_view.has_view         — есть номера с видом на море (вода порта и марины считается морем, как в расчёте)
#   noise_night.quiet_rooms   — есть номера, где ночью тихо (двор, верхние этажи, звукоизоляция по описаниям гостей)
#   noise_night.street_noisy  — со стороны улицы ночью шумно
#
# Уверенность разметчика: sure («уверен» — источник говорит прямо), likely («скорее» — косвенные признаки или один
# источник), unknown («не знаю» — в публичных источниках ответа нет, value не задаётся). В точность идут sure и likely;
# unknown считаются отдельно.
#
# Источники — страницы агрегаторов и отелей из веб-поиска 28.10.2026 (сводки поиска; страницы целиком не открывались,
# как в задаче 2.4). Это не эталон из натурных измерений: ни одна метка не проверена на месте. Сводки поиска собраны до
# просмотра фактов системы; факты по этим отелям разработчик видел до записи файла, метки по ним не менялись. Метки «нет вида на море» у городских отелей — «скорее»: ни один источник не называет вид на
# море, а расстояние до берега больше 600 м (отсутствие упоминания слабее прямого утверждения).
#
# group: coastal — отель не дальше 400 м от берега (как в проекте), urban — дальше.
