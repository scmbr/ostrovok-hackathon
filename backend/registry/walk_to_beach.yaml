key: walk_to_beach
title: Пешком до пляжа
description: Минуты пешком от отеля до ближайшего пляжа по пешеходному графу OSM
level: hotel
value_type: number
value_field: minutes
ttl_days: 180
significant_diff: 2 # разница меньше двух минут — «одинаково»
conflict_theta: 1.0
strategies:
  - tool: walk
    params: { speed_m_per_min: 80, snap_max_m: 200, beach_max_m: 4000 }
    base_reliability: 0.7
    independence_group: osm_walk_graph
ask_hotelier: Сколько минут пешком до пляжа и есть ли на пути оживлённые переходы?
ask_guest: Сколько минут вы шли от отеля до пляжа?
default_number: 10 # «пляж рядом» без числа — не дальше десяти минут
synonyms:
  - пляж
  - пляжа
  - пляже
  - пляжу
  - пляжем
  - пляжи
  - пляжей
  - пляжах
  - купаться
ambiguous_synonyms:
  - { phrase: у моря, label: пляж рядом (до 10 минут), value: 10, default: true }
  - { phrase: рядом с морем, label: пляж рядом (до 10 минут), value: 10, default: true }
  - { phrase: около моря, label: пляж рядом (до 10 минут), value: 10, default: true }
  - { phrase: возле моря, label: пляж рядом (до 10 минут), value: 10, default: true }
  - { phrase: близко к морю, label: пляж рядом (до 10 минут), value: 10, default: true }
  - { phrase: недалеко от моря, label: пляж рядом (до 10 минут), value: 10, default: true }
